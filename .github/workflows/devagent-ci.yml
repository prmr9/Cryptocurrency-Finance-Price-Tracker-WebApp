# Bootstrapped by DevAgent: minimal test CI for the detected stacks.
#
# This pre-merge gate is kept at PARITY with DevAgent's build gate (the check
# that actually blocks merges): a strict frontend build here plus the full
# server suite. KAN-60 closed the gap that let faults pass pre-merge and only
# surface post-merge as "CI failed after merge" (KAN-57).
name: CI
on:
  # PRs validate against the merge ref; main is re-validated post-merge.
  # No unfiltered all-branches push trigger — that only doubled feature-branch
  # runs the pull_request event already covers.
  pull_request:
  push:
    branches: [main]
concurrency:
  # Cancel superseded runs on the same PR branch, but never cancel a post-merge
  # run on main mid-flight — a cancelled main run would leave the gate reporting
  # a stale or absent result.
  group: devagent-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  node-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm test
      # This build step sets CI=true explicitly so react-scripts promotes eslint/webpack
      # warnings to hard errors — the same strict mode GitHub Actions exports for the
      # post-merge main build. Catching a new warning (an unused import,
      # react-hooks/exhaustive-deps, etc.) here pre-merge is what stops a green PR turning
      # main's build red post-merge ("CI failed after merge", KAN-57), the fix KAN-60 requires.
      - run: CI=true npx react-scripts build
  node-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # LOG_SINK=none selects the no-op telemetry sink so logged lines do not bury
    # the test reporter output (the server test script also sets this inline).
    env:
      LOG_SINK: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      # No services:/Docker container — the integration tests self-skip when
      # testcontainers/PG_TEST_URL are absent (see schema-integration.test.js).
      - run: npm ci
      - run: npm test
